name: Images

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Stable upstream tag (empty selects the highest stable version)
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:

concurrency:
  group: images-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check packaging
        run: python3 -m unittest discover -s tests -v
      - name: Resolve upstream tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python3 scripts/package.py plan --tag "$UPSTREAM_TAG"
      - name: Fetch exact source
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package.py prepare
      - name: Build images and run upstream tests
        if: steps.plan.outputs.needed == 'true'
        run: python3 scripts/package.py build
      - name: Test deployed images
        if: steps.plan.outputs.needed == 'true'
        run: python3 scripts/package.py smoke
      - name: Sign in to GHCR
        if: >-
          steps.plan.outputs.needed == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          github.repository_owner == 'tanakrit-d'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated images to GHCR and release deployment files
        if: >-
          steps.plan.outputs.needed == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          github.repository_owner == 'tanakrit-d'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package.py publish
